# render.yaml

services:
  - type: web_service
    name: morphea-backend
    env: python
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    # Al usar plan free, Render dormirá tras 15 min sin tráfico
    # (Auto-Sleep está activado por defecto en Free tier)

    # Si migras a plan de pago, estas líneas permitirán autoscaling:
    autoscale:
      minInstances: 0
      maxInstances: 2
      cpuThresholdPercent: 60

    envVars:
      - key: OPENAI_API_KEY
      - key: EMAIL_FROM
      - key: SMTP_USER
      - key: SMTP_PASS
      - key: SMTP_SERVER
      - key: SMTP_PORT
      # Puedes añadir aquí DATABASE_URL, STRIPE_SECRET_KEY, etc.

jobs:
  - type: cron_job
    name: vacuum-job
    schedule: "0 3 * * *"   # Cada día a las 03:00 UTC
    command: |
      psql $DATABASE_URL -c "VACUUM ANALYZE;"
